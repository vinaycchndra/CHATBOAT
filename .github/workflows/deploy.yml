name: Deploy Backend Stack

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Rebuild and Restart Containers
        run: |
          docker compose down
          docker compose up --build -d